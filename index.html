  const txt=textoFactura(v);
  abrir(`<h3>Factura N° ${nFact(v.numeroFactura)} <button class="x" data-close aria-label="Cerrar">×</button></h3>
  <div id="fPrev"><div class="empty">Preparando la factura…</div></div>
  <div class="actions"><button class="btn primary" id="fPdf" hidden style="background:#25a35a;border-color:#25a35a;color:#fff">📄 Enviar PDF por WhatsApp</button><button class="btn" id="fGuardar" hidden>Guardar imagen</button><button class="btn" id="fCopiar">Copiar texto</button></div>
  <div id="fPaso2" hidden class="calc" style="margin-top:12px;display:block"><b>PDF listo.</b> Ahora abre WhatsApp, entra al chat del cliente y toca 📎 → Documento para adjuntar la factura.<div class="actions" style="margin-top:10px"><a class="btn" href="https://wa.me/" target="_blank" rel="noopener" style="text-decoration:none;color:#25a35a;border-color:#25a35a">Abrir WhatsApp →</a></div></div>
  <p class="hint" id="fHint" style="margin-top:12px"></p>
  <textarea id="fTexto" hidden readonly rows="9" style="width:100%;margin-top:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px;font-size:13.5px">${esc(txt)}</textarea>`);
  $("#fCopiar").addEventListener("click",()=>{const ta=$("#fTexto");const ver=()=>{ta.hidden=false;ta.focus();ta.select();toast("Selecciona el texto y cópialo")};
    try{navigator.clipboard.writeText(txt).then(()=>toast("Texto copiado"),ver)}catch(e){ver()}});
  const cv=await dibujarFactura(v);if(!$("#fPrev"))return;
  $("#fPrev").innerHTML=`<img src="${cv.toDataURL("image/png")}" alt="Factura N° ${nFact(v.numeroFactura)} de ${esc(v.cliente)}" style="width:100%;display:block;border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow)">`;
  if(!DL){try{DL=window.claude&&await window.claude.use("downloads")}catch(e){}}
  if(!$("#fGuardar"))return;
  if(NATIVO()){$("#fPdf").hidden=false;$("#fGuardar").hidden=false;$("#fHint").textContent="Se abre el menú de compartir: escoge WhatsApp y el chat del cliente."}
  else if(DL){$("#fPdf").hidden=false;$("#fGuardar").hidden=false;$("#fHint").textContent="Si tu teléfono te muestra el menú de compartir, escoge WhatsApp y el cliente. Si solo lo guarda, adjúntalo desde el chat."}
  else $("#fHint").textContent="Mantén presionada la imagen para guardarla o compartirla por WhatsApp.";
  const nomBase=`Factura ${nFact(v.numeroFactura)} ${String(v.cliente).replace(/[^\p{L}\p{N} ]/gu,"").trim()}`.trim();
  $("#fPdf").addEventListener("click",()=>{if(NATIVO()){compartirNativo(pdfDesdeCanvas(cv),nomBase+".pdf","Factura "+nFact(v.numeroFactura)).catch(e=>{if(!cancelado(e))toast("No se pudo compartir el PDF")});return}
    DL.save({filename:nomBase+".pdf",data:pdfDesdeCanvas(cv)}).then(()=>{toast("PDF guardado");const p=$("#fPaso2");if(p){p.hidden=false;p.scrollIntoView({behavior:"smooth",block:"nearest"})}})
    .catch(e=>{const c=e&&e.code;if(c==="declined")return;toast(c==="extension_not_enabled"||c==="rejected_extension"?"Aquí no se puede guardar PDF. Usa Guardar imagen.":"No se pudo crear el PDF")})});
  $("#fGuardar").addEventListener("click",()=>{const nom=`Factura ${nFact(v.numeroFactura)} ${String(v.cliente).replace(/[^\p{L}\p{N} ]/gu,"").trim()}.png`;
    cv.toBlob(b=>{if(!b){toast("No se pudo crear la imagen");return}
      if(NATIVO()){compartirNativo(b,nom,"Factura "+nFact(v.numeroFactura)).catch(e=>{if(!cancelado(e))toast("No se pudo compartir la imagen")});return}
      DL.save({filename:nom,data:b}).then(()=>toast("Factura guardada")).catch(e=>{if(e&&e.code!=="declined")toast("No se pudo guardar la imagen")})},"image/png")});
}

document.addEventListener("click",async e=>{
  const t=e.target;
  if(t.id==="scrim"||t.closest("[data-close]")){cerrar();return}
  const act=t.closest("[data-act]")?.dataset.act;
  if(act==="menu"){$("#shell").classList.add("menu-open");return}
  if(act==="menuclose"){$("#shell").classList.remove("menu-open");return}
  if(act==="theme"){setSkin(document.documentElement.dataset.skin==="dark"?"light":"dark");return}
  if(act==="venta"){$("#shell").classList.remove("menu-open");hojaVenta();return}
  const tab=t.closest("[data-tab]");if(tab){S.tab=tab.dataset.tab;S.q="";recordar();$("#shell").classList.remove("menu-open");render();scrollTo(0,0);return}
  const ir=t.closest("[data-ir]");if(ir){S.tab=ir.dataset.ir;if(ir.dataset.filtro)S.filtro=ir.dataset.filtro;recordar();render();scrollTo(0,0);return}
  const f=t.closest("[data-f]");if(f){S.filtro=f.dataset.f;render();return}
  if(t.closest("#nuevoProd")){hojaProducto(null);return}
  if(t.closest("[data-nuevacamp]")){hojaCampana(null);return}
  if(t.closest("[data-nuevacot]")){hojaCotizacion(null);return}
  const qf=t.closest("[data-qf]");if(qf){S.qfiltro=qf.dataset.qf;render();return}
  const qc=t.closest("[data-cot]");if(qc){hojaCotizacion(qc.dataset.cot);return}
  const ec=t.closest("[data-editcamp]");if(ec){hojaCampana(ec.dataset.editcamp);return}
  const sc=t.closest("[data-selcamp]");if(sc){S.camp=sc.dataset.selcamp;recordar();render();scrollTo(0,0);return}
  const cc=t.closest("[data-cerrar]");if(cc&&!cc.disabled){const c=campById(cc.dataset.cerrar);
    if(!cc.classList.contains("armed")){cc.classList.add("armed");cc.textContent="Toca otra vez para cerrar";return}
    try{await guardar("campanas",c.id,{...sinId(c),cerrada:true,fechaCierre:today()});toast("Campaña cerrada")}catch(err){fallo(err)}return}
  const ra=t.closest("[data-reabrir]");if(ra){const c=campById(ra.dataset.reabrir);try{const d=sinId(c);d.cerrada=false;delete d.fechaCierre;await guardar("campanas",c.id,d);toast("Campaña reabierta")}catch(err){fallo(err)}return}

    const d={...sinId(c),etapa:nueva};if(nueva==="espera"&&today()<c.fechaPedido)d.fechaPedido=today();if(nueva==="empaquetado")d.fechaLlegada=today();
    try{await guardar("campanas",c.id,d);for(const v of ventasDe(c.id).filter(v=>v.entrega!=="entregado"&&v.entrega!==ETAPA_ENTREGA[nueva]))await guardar("ventas",v.id,{...sinId(v),entrega:ETAPA_ENTREGA[nueva]});toast(ETAPAS[nueva])}catch(err){et.disabled=false;fallo(err)}return}
  if(t.closest("#rExportar")){exportarRespaldo();return}
  if(t.closest("#rImportar")){const b=t.closest("#rImportar");if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="Toca otra vez para cargar";return}b.disabled=true;importarRespaldo();return}
  const fa=t.closest("[data-factura]");if(fa){hojaFactura(fa.dataset.factura);return}
  const v=t.closest("[data-venta]");if(v){hojaDetalle(v.dataset.venta);return}
  const p=t.closest("[data-prod]");if(p){hojaProducto(p.dataset.prod);return}

  if(t.closest("#limpiar")){const b=t.closest("#limpiar");if(!b.dataset.armed){b.dataset.armed="1";b.textContent="Toca otra vez para borrar";return}

  if(!db){S.mode="local";render();return}
  S.db=db;const listos=new Set();
  ["productos","ventas","campanas","cotizaciones"].forEach(col=>db.collection(col).onSnapshot(snap=>{
    S[col]=snap.docs.map(d=>({...d.data(),id:d.id}));listos.add(col);if(listos.size>=4)S.mode="ready";render()},
    err=>{if(err.code==="revoked"||err.code==="not_granted"){S.db=null;S.mode="local";render()}}));
})();
})();
</script>
