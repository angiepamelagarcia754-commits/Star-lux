<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fdf5f8">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Star Lux Ventas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Estructura de Kana Lux con paleta pastel: rosa, lavanda, menta y durazno sobre fondo rubor; modo noche opcional */
:root{
  color-scheme:light;
  --bg:#fdf5f8; --surface:#ffffff; --surface-2:#fbecf2; --ink:#45293d; --ink-2:#76596c; --muted:#a08899; --line:#f2dce6;
  --accent:#d4588a; --accent-ink:#ffffff; --accent-soft:#fde3ee;
  --lav:#7d63c9; --lav-soft:#eee8fc;
  --shein:#45293d; --temu:#c86a2c; --temu-soft:#fdebdc;
  --ok:#3f9a6b; --ok-soft:#e1f5ea; --warn:#b4771d; --warn-soft:#fdf0d9; --bad:#d04a5c; --bad-soft:#fde3e6;
  --shadow:0 2px 12px rgba(212,88,138,.08);
  --f-display:"DM Serif Display",Georgia,"Times New Roman",serif;
  --f-body:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --r:20px;
}
:root[data-skin="dark"]{
  color-scheme:dark;
  --bg:#1d1520; --surface:#281e2b; --surface-2:#322637; --ink:#fbeef5; --ink-2:#d6bfcd; --muted:#a690a0; --line:#3d2f42;
  --accent:#f4a3c4; --accent-ink:#3a1428; --accent-soft:#4a2638;
  --lav:#c3b2f5; --lav-soft:#352c4f;
  --shein:#fbeef5; --temu:#ffb48a; --temu-soft:#42291d;
  --ok:#8fdcb1; --ok-soft:#1f3a2c; --warn:#f6c987; --warn-soft:#3e2f1a; --bad:#ff9aa6; --bad-soft:#47222a;
  --shadow:0 2px 12px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---- bienvenida ---- */
.splash{position:fixed;inset:0;z-index:10000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;transition:opacity .45s ease}
.splash.out{opacity:0;pointer-events:none}
.splash .logo svg{width:132px;height:132px;display:block}
.splash h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:40px;color:var(--ink);letter-spacing:.5px}
.splash p{margin:0;font-size:19px;font-weight:800;color:var(--accent);letter-spacing:.3px}

/* ---- estructura ---- */
.shell{display:flex;min-height:100vh}
.sidebar{width:250px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:30}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;min-width:0}
.sidebar-brand .logo svg{width:36px;height:36px;display:block;flex:none}
.sidebar-brand b{font-family:var(--f-display);font-weight:400;font-size:20px;display:block;line-height:1.1}
.sidebar-brand small{color:var(--accent);font-weight:700;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-cta{margin:0 0 14px;justify-content:center;width:100%}
.sb-sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:4px 14px 6px}
.stagebar{display:flex;flex-direction:column;gap:3px;margin:0 0 14px}
.stagebtn{border:none;background:transparent;color:var(--ink-2);text-align:left;padding:12px 14px;border-radius:12px;font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:10px;width:100%}
.stagebtn:hover{background:var(--surface-2)}
.stagebtn.active{background:var(--accent-soft);color:var(--accent)}
.stagebtn .ico{width:22px;text-align:center;flex:none}
.stagebtn .lbl-t{flex:1;min-width:0}
.sb-badge{background:var(--bad);color:#fff;font-size:11px;border-radius:999px;padding:1px 7px;font-weight:700}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2)}
.sidebar-foot span{text-transform:capitalize}
.theme-toggle{position:relative;width:44px;height:24px;flex-shrink:0;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);padding:0}
.theme-toggle .thumb{position:absolute;top:1px;left:1px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;transition:left .18s ease}
.theme-toggle.light .thumb{left:21px}
.content-area{flex-grow:1;min-width:0;padding:32px 40px 48px;max-width:980px}
.page-head{margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-head > div{min-width:0}
.eyebrow2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.eyebrow2 .pill{text-transform:none;letter-spacing:0}
.page-head h1{font-size:30px;font-weight:400;margin:2px 0 0;font-family:var(--f-display)}
.mtop{display:none}
.sb-scrim{display:none}
.fab{display:grid;place-items:center;position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:32px;font-weight:600;line-height:1;box-shadow:0 8px 22px rgba(212,88,138,.35);z-index:20}
@media (max-width:860px){
  .shell{display:block}
  .mtop{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:25;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
  .mtop .sidebar-brand{padding:0;flex:1}
  .menu-btn{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;width:42px;height:42px;font-size:20px;color:var(--ink);flex:none}
  .sidebar{position:fixed;left:0;top:0;bottom:0;height:100%;transform:translateX(-105%);transition:transform .2s ease;box-shadow:0 0 30px rgba(0,0,0,.4);padding-top:calc(22px + env(safe-area-inset-top,0px))}
  .shell.menu-open .sidebar{transform:none}
  .shell.menu-open .sb-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:29}
  .content-area{padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .fab{display:grid;place-items:center;position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:32px;font-weight:600;line-height:1;box-shadow:0 8px 22px rgba(212,88,138,.35);z-index:20}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- componentes ---- */
.banner{border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.info{background:var(--warn-soft);color:var(--warn)}
.banner button{border:1px solid currentColor;background:none;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;color:inherit}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.kpi .l{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-body);font-weight:800;font-size:26px;margin-top:2px;line-height:1.1}
.kpi .h{font-size:12.5px;color:var(--muted)}
.kpi.hero{grid-column:1/-1;border-color:transparent;background:linear-gradient(135deg,var(--accent-soft),var(--lav-soft));padding:18px 20px}
.kpi.hero .v{font-size:36px;font-weight:800}
.kpi.hero .v em{font-style:normal;color:var(--accent)}

h2{font-family:var(--f-display);font-weight:400;font-size:23px;margin:26px 0 12px;text-wrap:balance;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
h2 small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 16px;box-shadow:var(--shadow)}
.panel.cierre{padding:14px 16px}

.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;border-radius:0}
.row:last-child{border-bottom:0}
button.row:hover{background:var(--surface-2)}
.row .t{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .d{font-size:13.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{text-align:right;font-weight:700}
.row .rd{text-align:right;font-size:12.5px}
.bar{grid-column:1/-1;height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;border-radius:2px}
.day{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:700;padding:16px 2px 2px}
.day:first-child{padding-top:8px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.5}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:1px 6px;border-radius:4px;margin-right:6px;vertical-align:1px}
.tag.SHEIN{background:var(--shein);color:var(--bg)}
.tag.Temu{background:var(--temu-soft);color:var(--temu)}
.tag.Otro{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.ex{font-size:10.5px;font-weight:600;color:var(--muted);border:1px dashed var(--muted);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}

.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;color:var(--ink-2)}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.search{flex:1 1 160px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px}

.empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:14px}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:18px;margin-bottom:4px}

/* paneles laterales, como en Kana Lux */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(580px,100%);height:100%;overflow-y:auto;padding:0 18px calc(28px + env(safe-area-inset-bottom,0px));border-left:1px solid var(--line);box-shadow:var(--shadow)}
.sheet h3{position:sticky;top:0;background:var(--bg);z-index:2;margin:0 -18px 16px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 12px;border-bottom:1px solid var(--line);font-family:var(--f-display);font-weight:400;font-size:26px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:1px solid var(--line);background:var(--surface-2);width:36px;height:36px;border-radius:10px;font-size:18px;color:var(--ink-2);flex:none}
.x:hover{color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:entra .22s ease-out}@keyframes entra{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}}

.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:13.5px;font-weight:700;color:var(--ink)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:none;padding:9px 6px;font-size:13.5px;font-weight:700;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.calc{grid-column:1/-1;background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;align-items:center}
.calc b{font-weight:700}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:11px;padding:10px 18px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:1}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--bad);font-size:13px;grid-column:1/-1;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;margin:0 0 6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;text-align:right;font-weight:700}
.kv a{color:var(--accent)}
.abono{display:flex;gap:8px;margin-top:12px}
.abono input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.stock{display:flex;align-items:center;gap:6px}
.stock button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;font-weight:700;z-index:80;white-space:nowrap;box-shadow:var(--shadow)}
@media (min-width:861px){.toast{bottom:24px}}
</style>
<style>
.campsel{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 30px 7px 14px;font-weight:600;font-size:13px;max-width:190px;min-width:0;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.p-acc{background:var(--lav-soft);color:var(--lav)}
.p-neutral{background:var(--line);color:var(--muted)}
.camp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.camp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.camp-name{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:-.01em;line-height:1.15;margin-bottom:6px;text-wrap:balance}
.camp-msg{font-size:14px;margin-top:10px;color:var(--ink)}
.tl{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin-top:16px;position:relative}
.tl::before{content:"";position:absolute;left:8.333%;right:8.333%;top:6px;height:2px;background:var(--line)}
.tl .fill{position:absolute;left:8.333%;top:6px;height:2px;background:var(--accent)}
.tl div.s{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:11px;line-height:1.25;color:var(--muted);position:relative}
.tl div.s i{width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.tl div.s.on i{background:var(--accent);border-color:var(--accent)}
.tl div.s.now{color:var(--ink);font-weight:700}
.tl div.s b{display:block;font-weight:600;color:inherit}
.prog{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--ok)}
.cierre{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cierre p{margin:0;font-size:13.5px;color:var(--muted);flex:1 1 200px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pagoline{margin-top:14px;font-size:13.5px;font-weight:600;padding:8px 12px;border-radius:10px}
.qitem{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:10px}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.linkbtn{border:0;background:none;color:var(--bad);padding:0;font-weight:600;font-size:13px}
.qmini{grid-column:1/-1;font-size:13px;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);grid-column:1/-1;margin-top:-4px}
</style>
<div class="splash" id="splash" aria-hidden="true"><span class="logo"></span><h1>Star Lux</h1><p>Cada pedido, bajo control</p></div>
<div class="shell" id="shell">
  <div class="mtop">
    <button class="menu-btn" data-act="menu" aria-label="Abrir menú">☰</button>
    <div class="sidebar-brand"><span class="logo"></span><div style="min-width:0"><b>Star Lux</b><small id="fase2">Reventa de SHEIN y Temu</small></div></div>
    <button class="theme-toggle" data-act="theme" type="button" title="Cambiar tema"><span class="thumb">🌙</span></button>
  </div>
  <div class="sb-scrim" data-act="menuclose"></div>
  <aside class="sidebar" aria-label="Menú">
    <div class="sidebar-brand"><span class="logo"></span><div style="min-width:0"><b>Star Lux</b><small>Reventa de SHEIN y Temu</small></div></div>
    <div class="sb-sec">Secciones</div>
    <div class="stagebar" id="stagebar"></div>
    <div class="sidebar-foot"><button class="theme-toggle" data-act="theme" type="button" title="Cambiar tema"><span class="thumb">🌙</span></button><span id="hoy"></span></div>
  </aside>
  <main class="content-area">
    <div class="page-head">
      <div><div class="eyebrow2" id="fase"></div><h1 id="ptitle">Campaña</h1></div>
    </div>
    <div id="banner"></div>
    <div id="view"><div class="empty"><b>Cargando tus ventas…</b></div></div>
  </main>
</div>
<div id="modal"></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=new Intl.NumberFormat("es-CR",{style:"currency",currency:"CRC",maximumFractionDigits:0});
const money=n=>fmt.format(Math.round(+n||0));
const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const num=v=>{const n=parseFloat(String(v).replace(/[^\d.,-]/g,"").replace(",","."));return isFinite(n)?n:0};
const dias=(a,b)=>Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/864e5);
const fCorta=d=>d?new Date(d+"T12:00").toLocaleDateString("es-CR",{day:"numeric",month:"short"}):"—";
const plural=(n,s,p)=>n+" "+(n===1?s:p);
const SUELTAS="_sueltas";
const APP=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const COLS=["productos","ventas","campanas","cotizaciones"];
function persistir(){if(!APP)return;try{const d={};COLS.forEach(c=>d[c]=S[c]);localStorage.setItem("starlux_datos",JSON.stringify(d))}catch(e){toast("No se pudo guardar en el teléfono")}}
function cargarLocal(){try{const d=JSON.parse(localStorage.getItem("starlux_datos")||"{}");COLS.forEach(c=>{if(Array.isArray(d[c]))S[c]=d[c]})}catch(e){}}
const NATIVO=()=>APP&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Share&&window.Capacitor.Plugins.Filesystem;
async function compartirNativo(blob,nombre,titulo){
  const{Filesystem,Share}=window.Capacitor.Plugins;
  const b64=await new Promise((r,j)=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(",")[1]);f.onerror=j;f.readAsDataURL(blob)});
  const w=await Filesystem.writeFile({path:nombre.replace(/[^\w.\-]+/g,"_"),data:b64,directory:"CACHE"});
  await Share.share({title:titulo||nombre,files:[w.uri],dialogTitle:titulo||"Compartir"});
}
const cancelado=e=>/cancel/i.test(String(e&&(e.message||e.errorMessage||e)));

const S={productos:[],ventas:[],campanas:[],cotizaciones:[],qfiltro:"pendiente",tab:"campanas",camp:null,filtro:"todas",q:"",db:null,mode:"loading"};
try{const t=localStorage.getItem("sl_tab2");if(t)S.tab=t;const c=localStorage.getItem("sl_camp");if(c)S.camp=c}catch(e){}
const recordar=()=>{try{localStorage.setItem("sl_tab2",S.tab);if(S.camp)localStorage.setItem("sl_camp",S.camp)}catch(e){}};

/* ---------- cálculos ---------- */
const itemsDe=v=>Array.isArray(v.items)&&v.items.length?v.items:[{nombre:v.productoNombre||"Producto",link:v.link||"",tienda:v.tienda||"Otro",cantidad:+v.cantidad||1,precioUnit:+v.precioUnit||0,costoUnit:+v.costoUnit||0,productoId:v.productoId||null}];
const total=v=>itemsDe(v).reduce((a,i)=>a+(+i.cantidad||0)*(+i.precioUnit||0),0);
const costoV=v=>itemsDe(v).reduce((a,i)=>a+(+i.cantidad||0)*(+i.costoUnit||0),0);
const piezasV=v=>itemsDe(v).reduce((a,i)=>a+(+i.cantidad||0),0);
const nombreV=v=>{const it=itemsDe(v);return it.length===1?it[0].nombre+(+it[0].cantidad>1?" ×"+it[0].cantidad:""):`${it[0].nombre} + ${it.length-1} más`};
const tagsV=v=>[...new Set(itemsDe(v).map(i=>i.tienda||"Otro"))].map(t=>`<span class="tag ${esc(t)}">${esc(t)}</span>`).join("");
const gan=v=>total(v)-costoV(v);
const saldo=v=>Math.max(0,total(v)-(+v.pagado||0));
const pctCosto=v=>{const c=costoV(v);return c>0?Math.round(gan(v)/c*100):null};
const pctClase=p=>p===null?"p-neutral":p<0?"p-bad":p<25?"p-warn":"p-ok";
const redondear=n=>Math.ceil(n/100)*100;
const estadoPago=v=>{const s=saldo(v);if(s<=0)return[v.numeroFactura?"Pagado · 🧾"+String(v.numeroFactura).padStart(4,"0"):"Pagado","p-ok"];return["Debe "+money(s),(+v.pagado||0)>0?"p-warn":"p-bad"]};
const ENTREGA={porpedir:"Por pedir",encamino:"En camino",empaquetado:"Empaquetado",pendiente:"Listo para entregar",entregado:"Entregado"};
const ETAPA_ENTREGA={encargos:"porpedir",espera:"encamino",empaquetado:"empaquetado",entregas:"pendiente"};
const ETAPAS={encargos:"Recibiendo encargos",espera:"En espera del pedido",empaquetado:"Empaquetando",entregas:"Entregando"};
const hayEjemplos=()=>S.cotizaciones.some(q=>q.ejemplo)||S.productos.some(p=>p.ejemplo)||S.ventas.some(v=>v.ejemplo)||S.campanas.some(c=>c.ejemplo);
const campById=id=>S.campanas.find(c=>c.id===id);
const ventasDe=cid=>S.ventas.filter(v=>cid===SUELTAS?!campById(v.campanaId):v.campanaId===cid);
const campsOrden=()=>S.campanas.slice().sort((a,b)=>(b.fechaPedido||"").localeCompare(a.fechaPedido||""));
const abiertas=()=>S.campanas.filter(c=>!estaCerrada(c)).sort((a,b)=>(a.fechaPedido||"").localeCompare(b.fechaPedido||""));
// campaña que recibe encargos nuevos: la abierta más próxima cuyo pedido aún no se hace
const campActual=()=>abiertas()[0]||null;
const campParaEncargos=()=>{const h=today();return abiertas().find(c=>c.fechaPedido>=h)||abiertas().slice(-1)[0]||null};

function stats(vs){
  const st={n:vs.length,vendido:0,costo:0,gan:0,cobrado:0,saldo:0,piezas:0,costoT:{SHEIN:0,Temu:0,Otro:0},deben:new Set(),sinEntregar:0};
  vs.forEach(v=>{st.vendido+=total(v);st.costo+=costoV(v);st.gan+=gan(v);st.cobrado+=Math.min(total(v),+v.pagado||0);st.saldo+=saldo(v);st.piezas+=piezasV(v);
    itemsDe(v).forEach(i=>{st.costoT[i.tienda in st.costoT?i.tienda:"Otro"]+=(+i.cantidad||0)*(+i.costoUnit||0)});if(saldo(v)>0)st.deben.add((v.cliente||"Cliente").trim());if(v.entrega!=="entregado")st.sinEntregar+=piezasV(v)||1});
  st.margen=st.costo?Math.round(st.gan/st.costo*100):0;return st;
}
function etapaDe(c){let e=c.etapa||"encargos";if(!(e in ETAPAS))e="encargos";if(e==="encargos"&&today()>=c.fechaPedido)e="espera";return e}
function estadoCamp(c,st){
  const h=today();const etapa=etapaDe(c);
  const falta=[];if(st.deben.size)falta.push(`cobrar ${money(st.saldo)} a ${plural(st.deben.size,"cliente","clientes")}`);if(st.sinEntregar)falta.push(`entregar ${plural(st.sinEntregar,"producto","productos")}`);
  let pago;
  if(!st.deben.size)pago={txt:st.n?"✓ Todos pagaron":"Límite de pago: "+fCorta(c.limitePago),cls:st.n?"p-ok":"p-neutral"};
  else if(h<=c.limitePago){const n=dias(h,c.limitePago);pago={txt:`Límite de pago ${fCorta(c.limitePago)} · ${n===0?"es hoy":"faltan "+plural(n,"día","días")} · deben ${plural(st.deben.size,"cliente","clientes")}`,cls:"p-warn"}}
  else pago={txt:`Pago vencido hace ${plural(dias(c.limitePago,h),"día","días")} · deben ${money(st.saldo)} (${plural(st.deben.size,"cliente","clientes")})`,cls:"p-bad"};
  const base={falta,pago,etapa};
  if(etapa!=="encargos"&&st.n>0&&!falta.length)return{...base,t:"Cerrada",cls:"p-neutral",paso:5,cerrada:true,msg:"Todos pagaron y recibieron su pedido. La campaña se cerró sola."};
  if(etapa==="encargos"){const n=dias(h,c.fechaPedido);return{...base,t:"Recibiendo encargos",cls:"p-acc",paso:0,msg:n===1?"Mañana haces el pedido.":`Faltan ${n} días para hacer el pedido (${fCorta(c.fechaPedido)}).`}}
  if(etapa==="espera"){
    if(c.llegadaEstimada&&h>c.llegadaEstimada)return{...base,t:"Pedido atrasado",cls:"p-bad",paso:2,msg:`Debía llegar el ${fCorta(c.llegadaEstimada)} y va con ${plural(dias(c.llegadaEstimada,h),"día","días")} de atraso. Avísale a tus clientes.`};
    return{...base,t:"En espera",cls:"p-warn",paso:2,msg:c.llegadaEstimada?`Pedido hecho. Llega aproximadamente el ${fCorta(c.llegadaEstimada)}.`:"Pedido hecho. Esperando que llegue."};
  }
  if(etapa==="empaquetado")return{...base,t:"Empaquetando",cls:"p-acc",paso:3,msg:`El pedido llegó${c.fechaLlegada?" el "+fCorta(c.fechaLlegada):""}. Arma el paquete de cada cliente.`};
  return{...base,t:"Entregando",cls:"p-acc",paso:4,msg:st.sinEntregar?`Falta entregar ${plural(st.sinEntregar,"producto","productos")}.`:"Todo entregado."+(st.deben.size?" Solo falta cobrar.":"")};
}
const estaCerrada=c=>estadoCamp(c,stats(ventasDe(c.id))).cerrada===true;

/* ---------- guardar ---------- */
async function guardar(col,id,data){
  if(S.db){await S.db.doc(col+"/"+id).set(data)}
  else{const arr=S[col];const i=arr.findIndex(x=>x.id===id);const o={...data,id};if(i>=0)arr[i]=o;else arr.push(o);persistir();render()}
}
async function borrar(col,id){
  if(S.db){await S.db.doc(col+"/"+id).delete()}
  else{S[col]=S[col].filter(x=>x.id!==id);persistir();render()}
}
const nuevoId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sinId=o=>{const c={...o};delete c.id;return c};
async function ajustarStock(pid,delta){const p=S.productos.find(x=>x.id===pid);if(!p)return;await guardar("productos",pid,{...sinId(p),stock:Math.max(0,(+p.stock||0)+delta)})}
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}
function fallo(e){toast(e&&e.code==="quota_exceeded"?"Se llenó el espacio. Borra registros viejos.":"No se pudo guardar. Intenta de nuevo.")}

/* ---------- render ---------- */
function asegurarCamp(){
  const valido=!!campById(S.camp);
  if(!valido){S.camp=(campActual()||campsOrden()[0]||{}).id||null}
}
function render(){
  asegurarCamp();
  {const act=campActual();const f=$("#fase");
   if(act&&S.mode!=="loading"){const e=estadoCamp(act,stats(ventasDe(act.id)));f.innerHTML=`${esc(act.nombre)} <span class="pill ${e.cls}">${e.t}</span>`;$("#fase2").textContent=act.nombre+" · "+e.t}
   else{f.textContent=S.campanas.length?"Sin campaña abierta":"Reventa de SHEIN y Temu";$("#fase2").textContent=f.textContent}}
  {const nCob=new Set(S.ventas.filter(v=>saldo(v)>0).map(v=>(v.cliente||"Cliente").trim())).size;
   const nCot=S.cotizaciones.filter(q=>(q.estado||"pendiente")==="pendiente").length;
   const SEC=[["campanas","📅","Campaña"],["ventas","🛍️","Ventas"],["cotizar","📝","Cotizaciones",nCot],["clientes","💵","Por cobrar",nCob],["facturas","🧾","Facturas"],["respaldo","💾","Respaldo"],["inventario","📦","Inventario"]];
   $("#stagebar").innerHTML=SEC.map(([k,i,l,c])=>`<button class="stagebtn${S.tab===k?" active":""}" data-tab="${k}" ${S.tab===k?'aria-current="page"':""}><span class="ico">${i}</span><span class="lbl-t">${l}</span>${c?`<span class="sb-badge">${c}</span>`:""}</button>`).join("");
   $("#ptitle").textContent=(SEC.find(x=>x[0]===S.tab)||SEC[0])[2];}
  let bn="";
  if(S.mode==="local"&&!APP)bn=`<div class="banner info">Esta vista no puede guardar datos. Lo que anotes se pierde al cerrar.</div>`;
  else if(hayEjemplos())bn=`<div class="banner info"><span>Estás viendo datos de ejemplo. Bórralos cuando empieces con tus ventas reales.</span><button id="limpiar">Borrar ejemplos</button></div>`;
  $("#banner").innerHTML=bn;
  if(S.mode==="loading"){$("#view").innerHTML=`<div class="empty"><b>Cargando tus ventas…</b></div>`;return}
  $("#view").innerHTML=({campanas:vCampanas,ventas:vVentas,inventario:vInventario,clientes:vClientes,cotizar:vCotizaciones,facturas:vFacturas,respaldo:vRespaldo}[S.tab]||vCampanas)();
  avisarCierres();
}

function vCampanas(){
  if(!S.campanas.length)return `<div class="panel"><div class="empty"><b>Crea tu primera campaña</b>Cada campaña es un pedido a SHEIN o Temu: le pones la fecha en que haces el pedido y el límite de pago de tus clientes.<div class="actions" style="justify-content:center"><button class="btn primary" data-nuevacamp style="flex:0 0 auto">+ Crear campaña</button></div></div></div>`;
  const cid=S.camp;const c=campById(cid);const vs=ventasDe(cid);const st=stats(vs);
  const act=campActual();
  let html=act?(cid!==act.id?`<div class="actions" style="margin:0 0 12px"><button class="btn" data-selcamp="${esc(act.id)}">← Volver a ${esc(act.nombre)}</button></div>`:""):`<div class="actions" style="margin:0 0 12px"><button class="btn primary" data-nuevacamp>+ Crear campaña</button></div>`;
  if(c){
    const e=estadoCamp(c,st);
    const pasos=[["Encargos",""],["Pedido",fCorta(c.fechaPedido)],["En espera",c.fechaLlegada?"llegó "+fCorta(c.fechaLlegada):c.llegadaEstimada?"aprox. "+fCorta(c.llegadaEstimada):""],["Empaquetado",""],["Entregas",""],["Cerrada",""]];
    const sig=e.cerrada?null:{encargos:["espera","Ya hice el pedido"],espera:["empaquetado","Llegó el pedido"],empaquetado:["entregas","Ya empaqueté todo"]}[e.etapa];
    html+=`<section class="camp">
      <div class="camp-head"><div><div class="camp-name">${esc(c.nombre)}${c.ejemplo?'<span class="ex">ejemplo</span>':""}</div><span class="pill ${e.cls}">${e.t}</span></div><button class="chip" data-editcamp="${esc(c.id)}">Editar</button></div>
      <div class="camp-msg">${esc(e.msg)}</div>
      <div class="tl"><span class="fill" style="width:${e.paso/5*83.333}%"></span>${pasos.map((p,i)=>`<div class="s ${i<=e.paso?"on":""} ${i===e.paso?"now":""}"><i></i><span>${p[0]}<b>${esc(p[1])}</b></span></div>`).join("")}</div>
      <div class="pagoline ${e.pago.cls}">${esc(e.pago.txt)}</div>
      ${sig?`<div class="actions"><button class="btn primary" data-etapa="${sig[0]}" data-camp="${esc(c.id)}">${sig[1]}</button></div>`:""}
      ${!e.cerrada&&e.etapa==="entregas"&&st.sinEntregar?`<div class="actions"><button class="btn" data-ir="ventas" data-filtro="entregar">Ver lo que falta entregar (${st.sinEntregar})</button></div>`:""}
    </section>`;
  }else{
    html+=`<section class="camp"><div class="camp-name">Ventas sin campaña</div><div class="camp-msg" style="color:var(--muted)">Ventas de inventario o que no asignaste a ninguna campaña.</div></section>`;
  }
  const pc=st.vendido?Math.round(st.cobrado/st.vendido*100):0;
  html+=`<section class="kpis">
    <div class="kpi hero"><div class="l">Ganancia de la campaña</div><div class="v num"><em>${money(st.gan)}</em></div><div class="h num">${money(st.vendido)} vendidos · ${plural(st.piezas,"pieza","piezas")} · margen ${st.margen}% sobre costo</div></div>
    <div class="kpi"><div class="l">Cobrado</div><div class="v num">${money(st.cobrado)}</div><div class="prog" aria-label="${pc}% cobrado"><i style="width:${pc}%"></i></div><div class="h num" style="margin-top:4px">${pc}% de lo vendido</div></div>
    <div class="kpi"><div class="l">Por cobrar</div><div class="v num" style="color:${st.saldo?"var(--bad)":"inherit"}">${money(st.saldo)}</div><div class="h">${st.deben.size?plural(st.deben.size,"cliente debe","clientes deben"):"nadie debe"}</div></div>
    <div class="kpi" style="grid-column:1/-1"><div class="l">Lo que pagas en el pedido</div><div class="v num">${money(st.costo)}</div><div class="h num">SHEIN ${money(st.costoT.SHEIN)} · Temu ${money(st.costoT.Temu)}${st.costoT.Otro?" · Otro "+money(st.costoT.Otro):""}</div></div>
  </section>`;
  if(c){
    const e=estadoCamp(c,st);
    html+=`<div class="panel cierre"><p>${e.cerrada?"Si vuelves a anotar una venta pendiente en esta campaña, se reabre sola.":st.n===0?"Se cerrará sola cuando hagas el pedido y todos hayan pagado y recibido.":`Se cierra sola cuando ya no falte nada. Ahora falta ${e.falta.join(" y ")}.`}</p>${e.cerrada?`<span class="pill p-ok">✓ Cerrada</span>`:""}</div>`;
  }
  if(st.deben.size){
    const m={};vs.forEach(v=>{const s=saldo(v);if(!s)return;const k=(v.cliente||"Cliente").trim();m[k]=m[k]||{n:k,s:0,c:0};m[k].s+=s;m[k].c++});
    html+=`<h2>Falta que paguen <small>${money(st.saldo)}</small></h2><div class="panel list">${Object.values(m).sort((a,b)=>b.s-a.s).map(x=>`<button class="row" data-cliente="${esc(x.n)}" data-scope="${esc(cid)}"><div class="t">${esc(x.n)}</div><div class="r num" style="color:var(--bad)">${money(x.s)}</div><div class="d">${plural(x.c,"pedido","pedidos")}</div><div class="rd" style="color:var(--muted)">Cobrar ›</div></button>`).join("")}</div>`;
  }
  const rec=vs.slice().sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")||(b.creado||0)-(a.creado||0));
  const maxPc=Math.max(100,...rec.map(v=>pctCosto(v)||0));
  if(c&&estaCerrada(c))html+=`<h2>Resumen de la campaña</h2>`+resumenHTML(c);
  html+=`<h2>Margen de cada venta <small>${plural(st.n,"venta","ventas")}</small></h2><div class="panel list">${rec.length?rec.slice(0,12).map(v=>{const p=pctCosto(v);const col=p===null?"var(--line)":p<0?"var(--bad)":p<25?"var(--warn)":"var(--ok)";
    return `<button class="row" data-venta="${esc(v.id)}"><div class="t">${tagsV(v)}${esc(nombreV(v))}</div><div class="r num">${p===null?"—":p+"%"}</div>
    <div class="d num">${esc(v.cliente)} · ganas ${money(gan(v))}</div><div class="rd num" style="color:var(--muted)">${money(total(v))}</div>
    <div class="bar"><i style="width:${p===null?0:Math.max(2,Math.min(100,p/maxPc*100))}%;background:${col}"></i></div></button>`}).join("")+(rec.length>12?`<button class="row" data-ir="ventas"><div class="t" style="color:var(--accent)">Ver las ${rec.length} ventas ›</div></button>`:""):`<div class="empty">Todavía no hay ventas aquí. Toca <strong>+ Nueva venta</strong> para anotar el primer encargo.</div>`}</div>`;
  html+=`<h2>Historial de campañas <small>${act?"La siguiente se crea cuando cierre "+esc(act.nombre):"Puedes crear la del próximo mes"}</small></h2><div class="panel list">${campsOrden().map(k=>{const s=stats(ventasDe(k.id));const e=estadoCamp(k,s);
    return `<button class="row" data-selcamp="${esc(k.id)}"${k.id===cid?' style="background:var(--accent-soft)"':""}><div class="t">${esc(k.nombre)}</div><div class="r num">${money(s.gan)}</div><div class="d num">Pedido ${fCorta(k.fechaPedido)} · límite ${fCorta(k.limitePago)}</div><div class="rd"><span class="pill ${e.cls}">${e.t}</span></div></button>`}).join("")||`<div class="empty">Aún no tienes campañas.</div>`}</div>`;
  return html;
}

function vVentas(){
  let vs=S.ventas.slice();
  if(S.filtro==="deben")vs=vs.filter(v=>saldo(v)>0);
  if(S.filtro==="entregar")vs=vs.filter(v=>v.entrega!=="entregado");
  const q=S.q.trim().toLowerCase();if(q)vs=vs.filter(v=>(v.cliente+" "+itemsDe(v).map(i=>i.nombre).join(" ")).toLowerCase().includes(q));
  vs.sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")||(b.creado||0)-(a.creado||0));
  let html=`<div class="actions" style="margin:0 0 12px"><button class="btn primary" data-act="venta">+ Nueva venta</button></div>
  <div class="toolbar">
    <button class="chip" data-f="todas" aria-pressed="${S.filtro==="todas"}">Todas</button>
    <button class="chip" data-f="deben" aria-pressed="${S.filtro==="deben"}">Me deben</button>
    <button class="chip" data-f="entregar" aria-pressed="${S.filtro==="entregar"}">Sin entregar</button>
    <input class="search" id="q" type="search" placeholder="Buscar cliente o producto" value="${esc(S.q)}">
  </div>`;
  if(!vs.length)return html+`<div class="panel"><div class="empty"><b>Sin ventas aquí</b>Toca <strong>+ Nueva venta</strong> para anotar un encargo.</div></div>`;
  let dia="",body="";
  vs.forEach(v=>{
    if(v.fecha!==dia){dia=v.fecha;body+=`<div class="day">${new Date(v.fecha+"T12:00").toLocaleDateString("es-CR",{weekday:"long",day:"numeric",month:"long"})}</div>`}
    const[et,ec]=estadoPago(v);const p=pctCosto(v);
    body+=`<button class="row" data-venta="${esc(v.id)}">
      <div class="t">${esc(v.cliente||"Cliente")}${v.ejemplo?'<span class="ex">ejemplo</span>':""}</div><div class="r num">${money(total(v))}</div>
      <div class="d">${tagsV(v)}${esc(nombreV(v))}${v.entrega!=="entregado"?" · "+(ENTREGA[v.entrega]||"Por entregar").toLowerCase():""}${p!==null?` · <b style="color:${p<0?"var(--bad)":"var(--ok)"}">+${p}%</b>`:""}</div>
      <div class="rd"><span class="pill ${ec} num">${esc(et)}</span></div></button>`;
  });
  return html+`<div class="panel list">${body}</div>`;
}

function vInventario(){
  const q=S.q.trim().toLowerCase();
  let ps=S.productos.slice();if(q)ps=ps.filter(p=>(p.nombre+" "+(p.variante||"")).toLowerCase().includes(q));
  ps.sort((a,b)=>(+b.stock>0)-(+a.stock>0)||a.nombre.localeCompare(b.nombre));
  let html=`<div class="toolbar"><input class="search" id="q" type="search" placeholder="Buscar producto" value="${esc(S.q)}"><button class="chip" id="nuevoProd">+ Producto</button></div>`;
  if(!ps.length)return html+`<div class="panel"><div class="empty"><b>Sin productos en stock</b>Aquí van las piezas que compraste para revender sin encargo. Los encargos de clientes no necesitan inventario.</div></div>`;
  return html+`<div class="panel list">${ps.map(p=>{
    const st=+p.stock||0;const mg=(+p.precio||0)-(+p.costo||0);
    const pill=st===0?`<span class="pill p-bad">Agotado</span>`:st===1?`<span class="pill p-warn">1 en stock</span>`:`<span class="pill p-ok">${st} en stock</span>`;
    return `<button class="row" data-prod="${esc(p.id)}"><div class="t"><span class="tag ${esc(p.tienda)}">${esc(p.tienda)}</span>${esc(p.nombre)}${p.ejemplo?'<span class="ex">ejemplo</span>':""}</div><div class="r num">${money(p.precio)}</div>
    <div class="d num">${p.variante?esc(p.variante)+" · ":""}costo ${money(p.costo)} · ganas ${money(mg)}${+p.costo?" ("+Math.round(mg/p.costo*100)+"%)":""}</div><div class="rd">${pill}</div></button>`}).join("")}</div>`;
}

function vClientes(){
  const m={};S.ventas.forEach(v=>{const s=saldo(v);if(s<=0)return;const k=(v.cliente||"Cliente").trim();m[k]=m[k]||{n:k,s:0,c:0,camps:new Set()};m[k].s+=s;m[k].c++;const c=campById(v.campanaId);m[k].camps.add(c?c.nombre:"Sin campaña")});
  const arr=Object.values(m).sort((a,b)=>b.s-a.s);const t=arr.reduce((a,c)=>a+c.s,0);
  if(!arr.length)return `<div class="panel"><div class="empty"><b>Nadie te debe</b>Cuando anotes un encargo sin pagar o con abono, el cliente aparece aquí.</div></div>`;
  return `<section class="kpis"><div class="kpi hero"><div class="l">Total por cobrar · todas las campañas</div><div class="v num"><em>${money(t)}</em></div><div class="h">${plural(arr.length,"cliente","clientes")}</div></div></section>
  <div class="panel list">${arr.map(c=>`<button class="row" data-cliente="${esc(c.n)}"><div class="t">${esc(c.n)}</div><div class="r num" style="color:var(--bad)">${money(c.s)}</div><div class="d">${plural(c.c,"pedido","pedidos")} · ${esc([...c.camps].join(", "))}</div><div class="rd" style="color:var(--muted)">Cobrar ›</div></button>`).join("")}</div>`;
}

/* ---------- hojas ---------- */
function abrir(html){$("#modal").innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`}
function cerrar(){$("#modal").innerHTML="";setTimeout(avisarCierres,350)}
const press=(seg,b)=>seg.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
const opcionesCamp=sel=>abiertas().map(c=>`<option value="${esc(c.id)}" ${c.id===sel?"selected":""}>${esc(c.nombre)} · pedido ${fCorta(c.fechaPedido)}</option>`).join("")+`<option value="" ${!sel?"selected":""}>Sin campaña</option>`;

function hojaCampana(id){
  const c=id?campById(id):null;
  if(!c&&campActual()){toast("Primero debe cerrarse "+campActual().nombre);return}
  const d=new Date();const sig=MESES[(d.getMonth()+1)%12];
  const nVentas=c?ventasDe(c.id).length:0;
  abrir(`<h3>${c?"Editar campaña":"Crear campaña"} <button class="x" data-close aria-label="Cerrar">×</button></h3>
  <form class="form" id="fCamp">
    <div class="f full"><label for="cNombre">Nombre</label><input id="cNombre" value="${esc(c?c.nombre:"Campaña "+sig)}"></div>
    <div class="f"><label for="cPedido">Fecha del pedido</label><input id="cPedido" type="date" value="${esc(c?.fechaPedido||"")}"></div>
    <div class="f"><label for="cLimite">Límite de pago</label><input id="cLimite" type="date" value="${esc(c?.limitePago||"")}"></div>
    <div class="f"><label for="cLlegada">Llegada estimada (opcional)</label><input id="cLlegada" type="date" value="${esc(c?.llegadaEstimada||"")}"></div>
    ${c?`<div class="f"><label for="cEtapa">Etapa</label><select id="cEtapa">${Object.entries(ETAPAS).map(([k,t])=>`<option value="${k}" ${etapaDe(c)===k?"selected":""}>${t}</option>`).join("")}</select></div>`:""}
    <div class="hint">El día del pedido compras todo en SHEIN y Temu. El límite de pago es cuando tus clientes deben haber cancelado. La campaña se cierra sola cuando todos pagaron y recibieron su pedido.</div>
    <div class="err" id="cErr"></div>
  </form>
  <div class="actions"><button class="btn primary" id="cGuardar">${c?"Guardar cambios":"Crear campaña"}</button>${c?`<button class="btn danger" id="cBorrar">Eliminar</button>`:""}</div>`);
  $("#fCamp").addEventListener("submit",e=>e.preventDefault());
  $("#cGuardar").addEventListener("click",async()=>{
    const nombre=$("#cNombre").value.trim(),fp=$("#cPedido").value,lp=$("#cLimite").value,err=$("#cErr");
    if(!nombre){err.textContent="Ponle un nombre a la campaña.";return}
    if(!fp||!lp){err.textContent="Pon la fecha del pedido y el límite de pago.";return}
    if(lp<fp){err.textContent="El límite de pago tiene que ser después de la fecha del pedido.";return}
    const nid=c?c.id:nuevoId();
    const data={...(c?sinId(c):{creado:Date.now(),etapa:"encargos"}),nombre,fechaPedido:fp,limitePago:lp,llegadaEstimada:$("#cLlegada").value||""};if($("#cEtapa"))data.etapa=$("#cEtapa").value;delete data.cerrada;delete data.fechaCierre;
    try{await guardar("campanas",nid,data);S.camp=nid;recordar();cerrar();toast(c?"Campaña actualizada":"Campaña creada");S.tab="campanas";render()}catch(e){fallo(e)}
  });
  $("#cBorrar")?.addEventListener("click",async e=>{const b=e.currentTarget;
    if(nVentas){$("#cErr").textContent=`Esta campaña tiene ${plural(nVentas,"venta","ventas")}. Muévelas a otra campaña o elimínalas antes de borrarla.`;return}
    if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="Toca otra vez";return}
    try{await borrar("campanas",c.id);S.camp=null;cerrar();toast("Campaña eliminada")}catch(e){fallo(e)}});
}

function hojaVenta(){
  const conStock=S.productos.filter(p=>+p.stock>0).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const clientes=[...new Set(S.ventas.map(v=>v.cliente).filter(Boolean))];
  const actual=campActual();const defEnt=actual?ETAPA_ENTREGA[etapaDe(actual)]:"porpedir";
  const nuevo=()=>({prod:"",nombre:"",link:"",tienda:"SHEIN",cantidad:1,costo:"",precio:""});
  let items=[nuevo()],pago="nada",estadoTocado=false;
  const prodDe=it=>it.prod?S.productos.find(p=>p.id===it.prod):null;
  const costoDe=it=>{const p=prodDe(it);return p?+p.costo||0:num(it.costo)};
  abrir(`<h3>Nueva venta <button class="x" data-close aria-label="Cerrar">×</button></h3>
  <div class="calc" style="display:block;margin-bottom:14px">${actual?`Se agrega a <b>${esc(actual.nombre)}</b> · pedido ${fCorta(actual.fechaPedido)}`:`No tienes una campaña abierta. La venta queda sin campaña y la puedes agregar después.`}</div>
  <div class="form"><div class="f full"><label for="vCliente">Cliente</label><input id="vCliente" list="dlClientes" placeholder="Nombre" autocomplete="off"><datalist id="dlClientes">${clientes.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></div></div>
  <div id="vItems"></div>
  <div class="f" style="margin-top:14px"><label>Ponerle precio a los encargos: cuánto quieres ganar sobre el costo</label><div class="seg" id="vSug"><button type="button" data-s="30">+30%</button><button type="button" data-s="50">+50%</button><button type="button" data-s="70">+70%</button><button type="button" data-s="100">+100%</button></div></div>
  <div class="calc num" id="vCalc" style="margin-top:12px"></div>
  <div class="form" style="margin-top:14px">
    <div class="f full"><label>Pago</label><div class="seg" id="segPago"><button type="button" data-p="nada" aria-pressed="true">Aún no paga</button><button type="button" data-p="abono" aria-pressed="false">Abonó</button><button type="button" data-p="todo" aria-pressed="false">Pagó todo</button></div></div>
    <div class="f full" id="wAbono" hidden><label for="vAbono">Monto abonado</label><input id="vAbono" inputmode="decimal" placeholder="₡"></div>
    <div class="f"><label for="vFecha">Fecha</label><input id="vFecha" type="date" value="${today()}"></div>
    <div class="f"><label for="vEntrega">Estado</label><select id="vEntrega">${Object.entries(ENTREGA).map(([k,t])=>`<option value="${k}" ${k===defEnt?"selected":""}>${t}</option>`).join("")}</select></div>
    <div class="f full"><label for="vNota">Nota (opcional)</label><input id="vNota" placeholder="Sinpe, dirección, tallas…"></div>
    <div class="err" id="vErr"></div>
  </div>
  <div class="actions" style="flex-direction:column"><button class="btn" id="vAdd">+ Agregar otro producto</button><button class="btn primary" id="vGuardar">Guardar venta</button></div>`);

  const calc=()=>{
    let t=0,c=0,pz=0;items.forEach(it=>{const q=Math.max(1,+it.cantidad||1);t+=q*num(it.precio);c+=q*costoDe(it);pz+=q});
    const g=t-c,pc=c?Math.round(g/c*100):null;
    $("#vCalc").innerHTML=`<span>${plural(pz,"pieza","piezas")} · Total <b>${money(t)}</b></span><span>Ganancia <b style="color:${g<0?"var(--bad)":"var(--ok)"}">${money(g)}</b>${t&&pc!==null?` <span class="pill ${pctClase(pc)}">${pc}%</span>`:""}</span>`;
    items.forEach((it,i)=>{const el=$("#vm"+i);if(!el)return;const co=costoDe(it),pr=num(it.precio),q=Math.max(1,+it.cantidad||1);
      el.textContent=co&&pr?`Subtotal ${money(pr*q)} · ganas ${money((pr-co)*q)} (${Math.round((pr-co)/co*100)}%)`:prodDe(it)?`Te costó ${money(co)} c/u`:"Pon costo y precio para ver tu ganancia"});
    $("#wAbono").hidden=pago!=="abono";
  };
  const pintar=()=>{
    $("#vItems").innerHTML=items.map((it,i)=>{const p=prodDe(it);return `<div class="qitem" data-i="${i}">
      <div class="qhead"><b>Producto ${i+1}</b>${items.length>1?`<button type="button" class="linkbtn" data-quitar="${i}">Quitar</button>`:""}</div>
      <div class="form">
        ${conStock.length?`<div class="f full"><label for="vs${i}">¿De dónde sale?</label><select id="vs${i}" data-k="prod"><option value="">Encargo de la app</option>${conStock.map(x=>`<option value="${esc(x.id)}" ${it.prod===x.id?"selected":""}>📦 ${esc(x.nombre)}${x.variante?" ("+esc(x.variante)+")":""} · quedan ${+x.stock}</option>`).join("")}</select></div>`:""}
        ${p?"":`<div class="f full"><label for="vn${i}">¿Qué pidió?</label><input id="vn${i}" data-k="nombre" value="${esc(it.nombre)}" placeholder="Ej. Blusa satinada negra talla S"></div>
        <div class="f full"><label for="vl${i}">Link (opcional)</label><input id="vl${i}" data-k="link" value="${esc(it.link)}" placeholder="Link de SHEIN o Temu"></div>
        <div class="f"><label for="vt${i}">Tienda</label><select id="vt${i}" data-k="tienda">${["SHEIN","Temu","Otro"].map(t=>`<option ${it.tienda===t?"selected":""}>${t}</option>`).join("")}</select></div>`}
        <div class="f"><label for="vc${i}">Cantidad</label><input id="vc${i}" data-k="cantidad" type="number" min="1" inputmode="numeric" value="${+it.cantidad||1}"></div>
        ${p?"":`<div class="f"><label for="vo${i}">Te cuesta c/u</label><input id="vo${i}" data-k="costo" inputmode="decimal" placeholder="₡" value="${it.costo===""?"":esc(it.costo)}"></div>`}
        <div class="f"><label for="vp${i}">Le cobras c/u</label><input id="vp${i}" data-k="precio" inputmode="decimal" placeholder="₡" value="${it.precio===""?"":esc(it.precio)}"></div>
        <div class="qmini num" id="vm${i}"></div>
      </div></div>`}).join("");
    calc();
  };
  pintar();
  const box=e=>e.target.closest("[data-i]");
  $("#vItems").addEventListener("input",e=>{const k=e.target.dataset.k,b=box(e);if(!k||!b||k==="prod")return;items[+b.dataset.i][k]=e.target.value;
    if(k==="precio"||k==="costo")$("#vSug").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));calc()});
  $("#vItems").addEventListener("change",e=>{const k=e.target.dataset.k,b=box(e);if(!k||!b)return;const it=items[+b.dataset.i];
    if(k==="prod"){it.prod=e.target.value;const p=prodDe(it);if(p){it.precio=p.precio||"";it.tienda=p.tienda}
      if(!estadoTocado)$("#vEntrega").value=items.every(x=>x.prod)?"entregado":defEnt;pintar()}
    else{it[k]=e.target.value;calc()}});
  $("#vItems").addEventListener("click",e=>{const b=e.target.closest("[data-quitar]");if(!b)return;items.splice(+b.dataset.quitar,1);pintar()});
  $("#vAdd").addEventListener("click",()=>{items.push(nuevo());pintar();const n=$("#vn"+(items.length-1));if(n)n.focus()});
  $("#vSug").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
    const enc=items.filter(it=>!it.prod&&num(it.costo));if(!enc.length){$("#vErr").textContent="Primero pon cuánto te cuesta cada encargo.";return}$("#vErr").textContent="";
    enc.forEach(it=>it.precio=redondear(num(it.costo)*(1+(+b.dataset.s)/100)));press($("#vSug"),b);pintar()});
  $("#segPago").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;pago=b.dataset.p;press($("#segPago"),b);calc()});
  $("#vEntrega").addEventListener("change",()=>estadoTocado=true);

  $("#vGuardar").addEventListener("click",async()=>{
    const err=$("#vErr");const out=[];const usoStock={};
    for(let i=0;i<items.length;i++){const it=items[i];const p=prodDe(it);const q=Math.max(1,Math.floor(+it.cantidad||1));const pr=num(it.precio);
      const nombre=p?p.nombre+(p.variante?" ("+p.variante+")":""):it.nombre.trim();
      if(!p&&!nombre&&!pr&&items.length>1)continue;
      if(!nombre){err.textContent=`Escribe qué es el producto ${i+1}.`;return}
      if(!p&&!num(it.costo)){err.textContent=`Pon cuánto te cuesta el producto ${i+1}.`;return}
      if(!pr){err.textContent=`Pon el precio del producto ${i+1}.`;return}
      if(p){usoStock[p.id]=(usoStock[p.id]||0)+q;if(usoStock[p.id]>+p.stock){err.textContent=`Solo te quedan ${+p.stock} de ${p.nombre}.`;return}}
      out.push({nombre,link:p?"":(it.link||"").trim(),tienda:p?p.tienda:it.tienda,cantidad:q,precioUnit:pr,costoUnit:p?+p.costo||0:num(it.costo),productoId:p?p.id:null})}
    if(!out.length){err.textContent="Agrega al menos un producto.";return}
    const tot=out.reduce((a,i)=>a+i.cantidad*i.precioUnit,0);
    const pagado=pago==="todo"?tot:pago==="nada"?0:Math.min(tot,num($("#vAbono").value));
    const v={tipo:out.every(i=>i.productoId)?"inventario":"encargo",campanaId:actual?actual.id:null,fecha:$("#vFecha").value||today(),cliente:$("#vCliente").value.trim()||"Cliente",
      items:out,pagado,entrega:$("#vEntrega").value,nota:$("#vNota").value.trim(),creado:Date.now()};if(tot>0&&pagado>=tot){v.numeroFactura=sigFactura();v.fechaPago=v.fecha}
    $("#vGuardar").disabled=true;
    try{await guardar("ventas",nuevoId(),v);for(const[pid,q]of Object.entries(usoStock))await ajustarStock(pid,-q);
      cerrar();S.camp=v.campanaId||SUELTAS;recordar();toast(out.length>1?`Venta guardada con ${out.length} productos`:"Venta guardada");render()}
    catch(e){$("#vGuardar").disabled=false;fallo(e)}
  });
}

function hojaDetalle(id){
  const v=S.ventas.find(x=>x.id===id);if(!v)return;const s=saldo(v);const pc=pctCosto(v);const its=itemsDe(v);
  const cAct=campById(v.campanaId);
  abrir(`<h3>${esc(v.cliente)} <button class="x" data-close aria-label="Cerrar">×</button></h3>
  <div class="panel list" style="margin-bottom:12px">${its.map(i=>{const q=+i.cantidad||0;const link=/^https?:\/\//i.test(i.link||"")?` · <a href="${esc(i.link)}" target="_blank" rel="noopener" style="color:var(--accent)">ver link</a>`:"";
    return `<div class="row"><div class="t"><span class="tag ${esc(i.tienda||"Otro")}">${esc(i.tienda||"Otro")}</span>${esc(i.nombre)}</div><div class="r num">${money(q*(+i.precioUnit||0))}</div>
    <div class="d num">${q} × ${money(i.precioUnit)} · costo ${money(i.costoUnit)}${link}</div><div class="rd num" style="color:${(+i.precioUnit||0)<(+i.costoUnit||0)?"var(--bad)":"var(--ok)"}">+${money(q*((+i.precioUnit||0)-(+i.costoUnit||0)))}</div></div>`}).join("")}</div>
  <dl class="kv num">
    <dt>Fecha</dt><dd>${esc(v.fecha)}</dd>
    <dt>Total</dt><dd>${money(total(v))}</dd>
    <dt>Te costó</dt><dd>${money(costoV(v))}</dd>
    <dt>Ganancia</dt><dd style="color:${gan(v)<0?"var(--bad)":"var(--ok)"}">${money(gan(v))}</dd>
    <dt>Margen</dt><dd>${pc===null?"—":`<span class="pill ${pctClase(pc)}">${pc}% sobre costo</span>`}</dd>
    <dt>Pagado</dt><dd>${money(v.pagado)}</dd>
    <dt>Saldo</dt><dd style="color:${s?"var(--bad)":"var(--ok)"}">${s?money(s):"Al día"}</dd>
    ${v.nota?`<dt>Nota</dt><dd>${esc(v.nota)}</dd>`:""}
  </dl>
  <div class="form" style="margin-top:12px">
    ${!cAct&&campActual()?`<div class="f"><label>Campaña</label><button type="button" class="btn" id="dAsignar">Agregar a ${esc(campActual().nombre)}</button></div>`:`<div class="f"><label>Campaña</label><div style="padding:10px 0;font-weight:700">${esc(cAct?cAct.nombre:"Sin campaña")}</div></div>`}
    <div class="f"><label for="dEstado">Estado del pedido</label><select id="dEstado">${Object.entries(ENTREGA).map(([k,t])=>`<option value="${k}" ${(v.entrega||"pendiente")===k?"selected":""}>${t}</option>`).join("")}</select></div>
  </div>
  ${s?`<div class="abono"><input id="dAbono" inputmode="decimal" placeholder="Abono ₡" aria-label="Monto del abono"><button class="btn" id="dAbonar">Registrar abono</button></div><div class="actions" style="margin-top:8px"><button class="btn primary" id="dPagoTotal">Pagó el saldo (${money(s)})</button></div>`:`<div class="actions"><button class="btn primary" id="dFactura">🧾 Ver factura${v.numeroFactura?" N° "+nFact(v.numeroFactura):""}</button></div>`}
  <div class="actions"><button class="btn danger" id="dBorrar">Eliminar venta</button></div>`);
  const upd=async(patch,msg)=>{try{await guardar("ventas",v.id,{...sinId(v),...patch});cerrar();toast(msg)}catch(e){fallo(e)}};
  $("#dAsignar")?.addEventListener("click",()=>upd({campanaId:campActual().id},"Agregada a "+campActual().nombre));
  $("#dEstado").addEventListener("change",e=>upd({entrega:e.target.value},"Estado: "+ENTREGA[e.target.value]));
  const pagar=async(nuevo,msg)=>{const nv={...v,pagado:nuevo};try{await guardar("ventas",v.id,sinId(nv));if(saldo(nv)<=0){toast("Venta pagada · factura lista");hojaFactura(v.id,nv)}else{cerrar();toast(msg)}}catch(e){fallo(e)}};
  $("#dAbonar")?.addEventListener("click",()=>{const a=num($("#dAbono").value);if(a>0)pagar(Math.min(total(v),(+v.pagado||0)+a),"Abono registrado")});
  $("#dPagoTotal")?.addEventListener("click",()=>pagar(total(v),"Venta pagada"));
  $("#dFactura")?.addEventListener("click",()=>hojaFactura(v.id));
  $("#dBorrar").addEventListener("click",async e=>{
    const b=e.currentTarget;if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="Toca otra vez para eliminar";return}
    try{await borrar("ventas",v.id);const ret=its.filter(i=>i.productoId);for(const i of ret)await ajustarStock(i.productoId,+i.cantidad||0);cerrar();toast(ret.length?"Venta eliminada, stock devuelto":"Venta eliminada")}catch(e){fallo(e)}
  });
}

  const p=id?S.productos.find(x=>x.id===id):null;
  abrir(`<h3>${p?"Editar producto":"Nuevo producto"} <button class="x" data-close aria-label="Cerrar">×</button></h3>

    <div class="calc num" id="pCalc"></div><div class="err" id="pErr"></div>

  const sync=()=>{const c=num($("#pCosto").value),pr=num($("#pPrecio").value);$("#pCalc").innerHTML=`<span>Ganas por pieza <b>${money(pr-c)}</b></span><span>Margen <b>${c?Math.round((pr-c)/c*100):0}% sobre costo</b></span>`};
  $("#fProd").addEventListener("input",sync);$("#fProd").addEventListener("submit",e=>e.preventDefault());

  sync();
  $("#pGuardar").addEventListener("click",async()=>{

function hojaCliente(nombre,scope){

/* ---------- cotizaciones ---------- */
const QEST={pendiente:["Esperando respuesta","p-warn"],aceptada:["Aceptada","p-ok"],rechazada:["No aceptó","p-neutral"]};
const qTot=q=>(q.items||[]).reduce((a,i)=>a+(+i.cantidad||0)*(+i.precio||0),0);
const qCos=q=>(q.items||[]).reduce((a,i)=>a+(+i.cantidad||0)*(+i.costo||0),0);
const qPiezas=q=>(q.items||[]).reduce((a,i)=>a+(+i.cantidad||0),0);

function vCotizaciones(){
  const f=S.qfiltro;const cnt={pendiente:0,aceptada:0,rechazada:0};S.cotizaciones.forEach(q=>cnt[q.estado||"pendiente"]++);
  let qs=S.cotizaciones.slice().sort((a,b)=>(b.creado||0)-(a.creado||0));if(f!=="todas")qs=qs.filter(q=>(q.estado||"pendiente")===f);
  let html=`<div class="actions" style="margin:0 0 12px"><button class="btn primary" data-nuevacot>+ Nueva cotización</button></div>
  <div class="toolbar">
    <button class="chip" data-qf="pendiente" aria-pressed="${f==="pendiente"}">Esperando (${cnt.pendiente})</button>
    <button class="chip" data-qf="aceptada" aria-pressed="${f==="aceptada"}">Aceptadas (${cnt.aceptada})</button>
    <button class="chip" data-qf="rechazada" aria-pressed="${f==="rechazada"}">No aceptó (${cnt.rechazada})</button>
    <button class="chip" data-qf="todas" aria-pressed="${f==="todas"}">Todas</button>
  </div>`;
  if(!qs.length)return html+`<div class="panel"><div class="empty"><b>${f==="pendiente"?"Nada esperando respuesta":"Sin cotizaciones aquí"}</b>Cuando un cliente te mande productos de SHEIN o Temu, anótalos en una cotización, ponle precio y mándale el mensaje.</div></div>`;
  return html+`<div class="panel list">${qs.map(q=>{const[et,ec]=QEST[q.estado||"pendiente"];const g=qTot(q)-qCos(q);const c=qCos(q);
    return `<button class="row" data-cot="${esc(q.id)}"><div class="t">${esc(q.cliente||"Cliente")}${q.ejemplo?'<span class="ex">ejemplo</span>':""}</div><div class="r num">${money(qTot(q))}</div>
    <div class="d num">${plural(qPiezas(q),"producto","productos")} · ${fCorta(q.fecha)} · ganas ${money(g)}${c?" ("+Math.round(g/c*100)+"%)":""}</div><div class="rd"><span class="pill ${ec}">${et}</span></div></button>`}).join("")}</div>`;
}

function hojaCotizacion(id){
  const q=id?S.cotizaciones.find(x=>x.id===id):null;
  const nuevo=()=>({nombre:"",link:"",tienda:"SHEIN",cantidad:1,costo:"",precio:""});
  let items=q&&q.items&&q.items.length?q.items.map(x=>({...x})):[nuevo()];
  const est=q?(q.estado||"pendiente"):"pendiente";const act=campActual();
  const clientes=[...new Set([...S.ventas.map(v=>v.cliente),...S.cotizaciones.map(x=>x.cliente)].filter(Boolean))];
  abrir(`<h3>${q?"Cotización":"Nueva cotización"} <button class="x" data-close aria-label="Cerrar">×</button></h3>
  ${q?`<div style="margin:-6px 0 12px"><span class="pill ${QEST[est][1]}">${QEST[est][0]}</span> <span style="color:var(--muted);font-size:13px">${fCorta(q.fecha)}</span></div>`:""}
  <div class="form"><div class="f full"><label for="qCliente">Cliente</label><input id="qCliente" list="dlQ" value="${esc(q?.cliente)}" placeholder="Nombre" autocomplete="off"><datalist id="dlQ">${clientes.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></div></div>
  <div id="qItems"></div>
  <div class="actions" style="margin-top:10px"><button class="btn" id="qAdd" style="flex:1">+ Agregar otro producto</button></div>
  <div class="f" style="margin-top:14px"><label>Ponerle precio a todo: cuánto quieres ganar sobre el costo</label><div class="seg" id="qSug"><button type="button" data-s="30">+30%</button><button type="button" data-s="50">+50%</button><button type="button" data-s="70">+70%</button><button type="button" data-s="100">+100%</button></div></div>
  <div class="calc num" id="qCalc" style="margin-top:12px"></div>
  <div class="f" style="margin-top:12px"><label for="qNota">Nota (opcional)</label><input id="qNota" value="${esc(q?.nota)}" placeholder="Tallas, colores, envío…"></div>
  <div class="err" id="qErr" style="margin-top:8px"></div>
  <div class="actions"><button class="btn primary" id="qGuardar">${q?"Guardar cambios":"Guardar cotización"}</button><button class="btn" id="qCopiar">Copiar mensaje</button></div>
  <textarea id="qTexto" hidden readonly rows="8" style="width:100%;margin-top:10px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-size:13.5px"></textarea>
  ${q&&est==="pendiente"?`<div class="actions"><button class="btn primary" id="qAcepta" style="background:var(--ok);border-color:var(--ok)">Aceptó · pasar a ventas</button><button class="btn" id="qRechaza">No aceptó</button></div>`:""}
  ${q&&est==="rechazada"?`<div class="actions"><button class="btn" id="qReabrir">Volver a "esperando respuesta"</button></div>`:""}
  ${q?`<div class="actions"><button class="btn danger" id="qBorrar">Eliminar cotización</button></div>`:""}`);

  const calc=()=>{
    const o={items};const t=qTot(o),c=qCos(o),g=t-c;
    $("#qCalc").innerHTML=`<span>Total al cliente <b>${money(t)}</b></span><span>Te cuesta <b>${money(c)}</b></span><span>Ganas <b style="color:${g<0?"var(--bad)":"var(--ok)"}">${money(g)}</b>${c&&t?` <span class="pill ${pctClase(Math.round(g/c*100))}">${Math.round(g/c*100)}%</span>`:""}</span>`;
    items.forEach((it,i)=>{const el=$("#qm"+i);if(!el)return;const co=num(it.costo),pr=num(it.precio);el.textContent=co&&pr?`Ganas ${money((pr-co)*(+it.cantidad||1))} · ${Math.round((pr-co)/co*100)}% sobre costo`:"Pon costo y precio para ver tu ganancia"});
  };
  const pintar=()=>{
    $("#qItems").innerHTML=items.map((it,i)=>`<div class="qitem" data-i="${i}">
      <div class="qhead"><b>Producto ${i+1}</b>${items.length>1?`<button type="button" class="linkbtn" data-quitar="${i}">Quitar</button>`:""}</div>
      <div class="form">
        <div class="f full"><label for="qn${i}">¿Qué es?</label><input id="qn${i}" data-k="nombre" value="${esc(it.nombre)}" placeholder="Ej. Vestido negro talla M"></div>
        <div class="f full"><label for="ql${i}">Link (opcional)</label><input id="ql${i}" data-k="link" value="${esc(it.link)}" placeholder="Link de SHEIN o Temu"></div>
        <div class="f"><label for="qt${i}">Tienda</label><select id="qt${i}" data-k="tienda">${["SHEIN","Temu","Otro"].map(t=>`<option ${it.tienda===t?"selected":""}>${t}</option>`).join("")}</select></div>
        <div class="f"><label for="qc${i}">Cantidad</label><input id="qc${i}" data-k="cantidad" type="number" min="1" inputmode="numeric" value="${+it.cantidad||1}"></div>
        <div class="f"><label for="qo${i}">Te cuesta c/u</label><input id="qo${i}" data-k="costo" inputmode="decimal" placeholder="₡" value="${it.costo===""?"":+it.costo}"></div>
        <div class="f"><label for="qp${i}">Le cobras c/u</label><input id="qp${i}" data-k="precio" inputmode="decimal" placeholder="₡" value="${it.precio===""?"":+it.precio}"></div>
        <div class="qmini num" id="qm${i}"></div>
      </div></div>`).join("");
    calc();
  };
  pintar();
  $("#qItems").addEventListener("input",e=>{const k=e.target.dataset.k;const box=e.target.closest("[data-i]");if(!k||!box)return;items[+box.dataset.i][k]=e.target.value;
    if(k==="precio"||k==="costo")$("#qSug").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));calc()});
  $("#qItems").addEventListener("change",e=>{const k=e.target.dataset.k;const box=e.target.closest("[data-i]");if(k&&box){items[+box.dataset.i][k]=e.target.value;calc()}});
  $("#qItems").addEventListener("click",e=>{const b=e.target.closest("[data-quitar]");if(!b)return;items.splice(+b.dataset.quitar,1);pintar()});
  $("#qAdd").addEventListener("click",()=>{items.push(nuevo());pintar();const n=$("#qn"+(items.length-1));if(n)n.focus()});
  $("#qSug").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
    if(!items.some(it=>num(it.costo))){$("#qErr").textContent="Primero pon cuánto te cuesta cada producto.";return}$("#qErr").textContent="";
    items.forEach(it=>{const c=num(it.costo);if(c)it.precio=redondear(c*(1+(+b.dataset.s)/100))});press($("#qSug"),b);pintar()});

  const limpios=()=>items.filter(it=>it.nombre.trim()||num(it.precio)).map(it=>({nombre:it.nombre.trim(),link:(it.link||"").trim(),tienda:it.tienda||"SHEIN",cantidad:Math.max(1,Math.floor(+it.cantidad||1)),costo:num(it.costo),precio:num(it.precio)}));
  const validar=()=>{const its=limpios();const err=$("#qErr");
    if(!its.length){err.textContent="Agrega al menos un producto.";return null}
    const malo=its.findIndex(it=>!it.nombre||!it.precio);if(malo>=0){err.textContent=`Al producto ${malo+1} le falta el nombre o el precio.`;return null}
    err.textContent="";return its};
  const datos=its=>({...(q?sinId(q):{creado:Date.now(),fecha:today(),estado:"pendiente"}),cliente:$("#qCliente").value.trim()||"Cliente",items:its,nota:$("#qNota").value.trim()});
  const qid=q?q.id:nuevoId();

  $("#qGuardar").addEventListener("click",async()=>{const its=validar();if(!its)return;
    try{await guardar("cotizaciones",qid,datos(its));cerrar();toast("Cotización guardada");S.tab="cotizar";S.qfiltro=q?S.qfiltro:"pendiente";render()}catch(e){fallo(e)}});

  $("#qCopiar").addEventListener("click",()=>{const its=validar();if(!its)return;
    const cli=$("#qCliente").value.trim();const t=qTot({items:its});
    let txt=`Hola${cli?" "+cli:""}, te paso la cotización de Star Lux:\n\n`+its.map(it=>`• ${it.nombre} (${it.tienda})${it.cantidad>1?" x"+it.cantidad:""}: ${money(it.precio*it.cantidad)}`).join("\n")+`\n\nTotal: ${money(t)}`;
    if(act&&etapaDe(act)==="encargos")txt+=`\n\nEl pedido se hace el ${fCorta(act.fechaPedido)} y el pago es hasta el ${fCorta(act.limitePago)}.`;
    const nota=$("#qNota").value.trim();if(nota)txt+=`\n${nota}`;
    const ta=$("#qTexto");ta.value=txt;
    const mostrar=()=>{ta.hidden=false;ta.focus();ta.select();toast("Selecciona el texto y cópialo")};
    try{navigator.clipboard.writeText(txt).then(()=>{ta.hidden=false;toast("Mensaje copiado, pégalo en WhatsApp")},mostrar)}catch(e){mostrar()}});

  $("#qAcepta")?.addEventListener("click",async e=>{const b=e.currentTarget;const its=validar();if(!its)return;
    if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent=`Toca otra vez: se crea una venta con ${plural(its.length,"producto","productos")}${act?" en "+act.nombre:" sin campaña"}`;return}
    b.disabled=true;const cliente=$("#qCliente").value.trim()||"Cliente";const defEnt=act?ETAPA_ENTREGA[etapaDe(act)]:"porpedir";const ids=[];
    try{const vid=nuevoId();ids.push(vid);
        await guardar("ventas",vid,{tipo:"encargo",campanaId:act?act.id:null,fecha:today(),cliente,items:its.map(it=>({nombre:it.nombre,link:it.link,tienda:it.tienda,cantidad:it.cantidad,precioUnit:it.precio,costoUnit:it.costo,productoId:null})),pagado:0,entrega:defEnt,nota:"De cotización",cotizacionId:qid,creado:Date.now()});
      await guardar("cotizaciones",qid,{...datos(its),estado:"aceptada",ventaIds:ids,fechaRespuesta:today()});
      cerrar();toast("Venta creada")}catch(err){b.disabled=false;fallo(err)}});
  $("#qRechaza")?.addEventListener("click",async()=>{const its=validar();if(!its)return;try{await guardar("cotizaciones",qid,{...datos(its),estado:"rechazada",fechaRespuesta:today()});cerrar();toast("Marcada como no aceptada")}catch(e){fallo(e)}});
  $("#qReabrir")?.addEventListener("click",async()=>{try{const d=sinId(q);d.estado="pendiente";delete d.fechaRespuesta;await guardar("cotizaciones",q.id,d);cerrar();toast("Esperando respuesta")}catch(e){fallo(e)}});
  $("#qBorrar")?.addEventListener("click",async e=>{const b=e.currentTarget;if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="Toca otra vez para eliminar";return}
    try{await borrar("cotizaciones",q.id);cerrar();toast("Cotización eliminada")}catch(err){fallo(err)}});
}


/* ---------- resumen de campaña ---------- */
function resumenHTML(c){
  const vs=ventasDe(c.id);const st=stats(vs);
  const clientes={};const prods={};const tienda={SHEIN:[0,0],Temu:[0,0],Otro:[0,0]};
  vs.forEach(v=>{const k=(v.cliente||"Cliente").trim();clientes[k]=clientes[k]||{n:k,t:0,c:0};clientes[k].t+=total(v);clientes[k].c++;
    itemsDe(v).forEach(i=>{const q=+i.cantidad||0,t=q*(+i.precioUnit||0),g=q*((+i.precioUnit||0)-(+i.costoUnit||0));
      const tk=i.tienda in tienda?i.tienda:"Otro";tienda[tk][0]+=t;tienda[tk][1]+=g;
      const pk=i.nombre||"Producto";prods[pk]=prods[pk]||{n:pk,t:i.tienda,q:0,g:0};prods[pk].q+=q;prods[pk].g+=g})});
  const nCli=Object.keys(clientes).length;
  const topC=Object.values(clientes).sort((a,b)=>b.t-a.t).slice(0,5);
  const topP=Object.values(prods).sort((a,b)=>b.g-a.g).slice(0,5);
  const tt=tienda.SHEIN[0]+tienda.Temu[0]+tienda.Otro[0]||1;
  const fila=(k,col)=>tienda[k][0]?`<div class="row"><div class="t"><span class="tag ${k}">${k}</span>${Math.round(tienda[k][0]/tt*100)}% de lo vendido</div><div class="r num">${money(tienda[k][0])}</div><div class="d num">Ganancia ${money(tienda[k][1])}</div><div class="rd"></div><div class="bar"><i style="width:${tienda[k][0]/tt*100}%;background:${col}"></i></div></div>`:"";
  return `<section class="kpis">
    <div class="kpi hero"><div class="l">Ganancia de la campaña</div><div class="v num"><em>${money(st.gan)}</em></div><div class="h num">Margen de ${st.margen}% sobre lo que pagaste</div></div>
    <div class="kpi"><div class="l">Vendiste</div><div class="v num">${money(st.vendido)}</div><div class="h">${plural(st.n,"venta","ventas")}</div></div>
    <div class="kpi"><div class="l">Pagaste el pedido</div><div class="v num">${money(st.costo)}</div><div class="h">SHEIN ${money(st.costoT.SHEIN)} · Temu ${money(st.costoT.Temu)}</div></div>
    <div class="kpi"><div class="l">Clientes</div><div class="v num">${nCli}</div><div class="h">Compra promedio ${money(st.n?st.vendido/st.n:0)}</div></div>
    <div class="kpi"><div class="l">Piezas</div><div class="v num">${st.piezas}</div><div class="h">Ganas ${money(st.piezas?st.gan/st.piezas:0)} por pieza</div></div>
  </section>
  <div class="panel" style="padding:14px 16px;margin-bottom:6px"><dl class="kv num" style="border:0;padding:0;margin:0;box-shadow:none">
    <dt>Pedido</dt><dd>${fCorta(c.fechaPedido)}</dd>
    <dt>Llegó</dt><dd>${c.fechaLlegada?fCorta(c.fechaLlegada)+(c.llegadaEstimada&&c.fechaLlegada>c.llegadaEstimada?` <span class="pill p-warn">${plural(dias(c.llegadaEstimada,c.fechaLlegada),"día","días")} tarde</span>`:""):"—"}</dd>
    <dt>Límite de pago</dt><dd>${fCorta(c.limitePago)}</dd>
  </dl></div>
  <h2>SHEIN vs Temu</h2><div class="panel list">${fila("SHEIN","var(--shein)")}${fila("Temu","var(--temu)")}${fila("Otro","var(--muted)")}</div>
  <h2>Mejores clientes</h2><div class="panel list">${topC.map((x,i)=>`<div class="row"><div class="t">${i+1}. ${esc(x.n)}</div><div class="r num">${money(x.t)}</div><div class="d">${plural(x.c,"compra","compras")}</div><div class="rd"></div></div>`).join("")}</div>
  <h2>Lo que más te dejó</h2><div class="panel list">${topP.map(p=>`<div class="row"><div class="t"><span class="tag ${esc(p.t||"Otro")}">${esc(p.t||"Otro")}</span>${esc(p.n)}</div><div class="r num" style="color:var(--ok)">+${money(p.g)}</div><div class="d">${plural(p.q,"pieza","piezas")}</div><div class="rd"></div></div>`).join("")}</div>`;
}
function hojaResumen(c){
  abrir(`<h3>🎉 ${esc(c.nombre)} cerrada <button class="x" data-close aria-label="Cerrar">×</button></h3>
  <p style="margin:0 0 14px;color:var(--ink-2)">Todos tus clientes pagaron y recibieron su pedido. Este es el resumen de la campaña.</p>
  ${resumenHTML(c)}
  <div class="actions" style="margin-top:22px">${campActual()?"":`<button class="btn primary" data-nuevacamp>Crear la siguiente campaña</button>`}<button class="btn" data-close>Listo</button></div>`);
}
function avisarCierres(){
  if(S.mode!=="ready"||!(S.db||APP))return;
  let vistas=null;try{vistas=JSON.parse(localStorage.getItem("sl_cerradas")||"null")}catch(e){}
  const cerradas=S.campanas.filter(estaCerrada).map(c=>c.id);
  const guardarV=a=>{try{localStorage.setItem("sl_cerradas",JSON.stringify(a))}catch(e){}};
  if(!vistas){guardarV(cerradas);return}
  const nueva=cerradas.find(id=>!vistas.includes(id));
  if(nueva&&!$("#modal").innerHTML){guardarV([...vistas,nueva]);S.camp=nueva;hojaResumen(campById(nueva));setTimeout(render,0)}
}

async function exportarRespaldo(){
  const d={app:"starlux",version:1,fecha:today()};COLS.forEach(c=>d[c]=S[c]);
  const blob=new Blob([JSON.stringify(d)],{type:"application/json"});const nom=`starlux-respaldo-${today()}.json`;
  if(NATIVO()){try{await compartirNativo(blob,nom,"Respaldo Star Lux")}catch(e){if(!cancelado(e))toast("No se pudo exportar")}return}
  if(!DL){try{DL=window.claude&&await window.claude.use("downloads")}catch(e){}}
  if(!DL){toast("Aquí no se puede guardar el archivo");return}
  DL.save({filename:nom,data:blob}).then(()=>toast("Respaldo guardado")).catch(e=>{if(e&&e.code!=="declined")toast("No se pudo guardar el respaldo")});
}
let respaldoLeido=null;
async function importarRespaldo(){
  const d=respaldoLeido;if(!d)return;let n=0;
  try{for(const c of COLS)for(const x of(d[c]||[])){if(!x||!x.id)continue;await guardar(c,x.id,sinId(x));n++}
    toast(`Respaldo cargado: ${plural(n,"registro","registros")}`);respaldoLeido=null;S.tab="campanas";render()}catch(e){fallo(e)}
}

function vFacturas(){
  const pagadas=S.ventas.filter(v=>saldo(v)<=0&&total(v)>0);
  const q=S.q.trim().toLowerCase();
  let fs=pagadas.filter(v=>!q||(v.cliente+" "+nFact(v.numeroFactura)+" "+itemsDe(v).map(i=>i.nombre).join(" ")).toLowerCase().includes(q));
  fs.sort((a,b)=>(+b.numeroFactura||0)-(+a.numeroFactura||0)||(b.fechaPago||b.fecha||"").localeCompare(a.fechaPago||a.fecha||""));
  const conNum=pagadas.filter(v=>v.numeroFactura).length;const tot=pagadas.reduce((a,v)=>a+total(v),0);
  let html=`<section class="kpis"><div class="kpi hero"><div class="l">Total facturado</div><div class="v num"><em>${money(tot)}</em></div><div class="h">${plural(pagadas.length,"venta pagada","ventas pagadas")} · ${plural(conNum,"factura emitida","facturas emitidas")}</div></div></section>
  <div class="toolbar"><input class="search" id="q" type="search" placeholder="Buscar cliente, producto o número" value="${esc(S.q)}"></div>`;
  if(!fs.length)return html+`<div class="panel"><div class="empty"><b>${q?"Sin resultados":"Aún no hay facturas"}</b>${q?"Prueba con otro nombre o número.":"Cuando un cliente cancela todo, su factura aparece aquí lista para enviar."}</div></div>`;
  return html+`<div class="panel list">${fs.map(v=>`<button class="row" data-factura="${esc(v.id)}"><div class="t">${v.numeroFactura?`<span style="color:var(--accent)">N° ${nFact(v.numeroFactura)}</span> · `:""}${esc(v.cliente)}${v.ejemplo?'<span class="ex">ejemplo</span>':""}</div><div class="r num">${money(total(v))}</div>
    <div class="d">${tagsV(v)}${esc(nombreV(v))} · ${fCorta(v.fechaPago||v.fecha)}</div><div class="rd">${v.numeroFactura?'<span class="pill p-ok">Ver factura</span>':'<span class="pill p-acc">Crear factura</span>'}</div></button>`).join("")}</div>`;
}

function rrect(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
function ajustar(x,t,max){t=String(t||"");if(x.measureText(t).width<=max)return t;while(t.length>1&&x.measureText(t+"…").width>max)t=t.slice(0,-1);return t+"…"}
function cargarImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}

  x.fillStyle=mut;x.font=F(800,21);x.fillText("PRODUCTO",P,520);x.textAlign="right";x.fillText("CANT.",W-P-250,520);x.fillText("SUBTOTAL",W-P,520);x.textAlign="left";
  x.fillStyle=linea;x.fillRect(P,538,W-2*P,3);

    x.fillStyle=ink;x.font=F(700,31);x.fillText(ajustar(x,i.nombre,W-2*P-380),P,y+50);

  x.fillStyle="#3f9a6b";x.font=F(800,46);x.textAlign="center";x.fillText("PAGADO ✓",0,16);x.restore();

function pdfDesdeCanvas(cv){
  const jpg=cv.toDataURL("image/jpeg",0.92);const bin=atob(jpg.split(",")[1]);const img=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)img[i]=bin.charCodeAt(i);
  const W=595.28,H=+(W*cv.height/cv.width).toFixed(2);
  const enc=new TextEncoder();const parts=[];let len=0;const offs=[];
  const push=x=>{const b=typeof x==="string"?enc.encode(x):x;parts.push(b);len+=b.length};
  const obj=(n,body)=>{offs[n]=len;push(`${n} 0 obj\n`);body.forEach(push);push("\nendobj\n")};
  const content=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
  push("%PDF-1.4\n");
  obj(1,["<< /Type /Catalog /Pages 2 0 R >>"]);
  obj(2,["<< /Type /Pages /Kids [3 0 R] /Count 1 >>"]);
  obj(3,[`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`]);
  obj(4,[`<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`,img,"\nendstream"]);
  obj(5,[`<< /Length ${content.length} >>\nstream\n${content}\nendstream`]);
  const xref=len;
  push(`xref\n0 6\n0000000000 65535 f \n`+[1,2,3,4,5].map(n=>String(offs[n]).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts,{type:"application/pdf"});
}
async function hojaFactura(id,vObj){
  let v=vObj||S.ventas.find(x=>x.id===id);if(!v)return;
  if(saldo(v)>0){toast("La factura se crea cuando el cliente cancela todo");return}
