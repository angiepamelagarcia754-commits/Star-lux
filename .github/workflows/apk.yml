name: Construir APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ordenar archivos
        run: |
          mkdir -p www assets ~/.android
          pick(){ best=""; bt=-1; for f in "$@"; do [ -f "$f" ] || continue; t=$(git log -1 --format=%ct -- "$f"); t=${t:-0}; if [ "$t" -ge "$bt" ]; then bt=$t; best="$f"; fi; done; echo "$best"; }
          f=$(pick index*.html); echo "App: $f"; cp "$f" www/index.html
          p=$(pick package*.json); echo "package: $p"; if [ -n "$p" ] && [ "$p" != "package.json" ]; then cp "$p" package.json; fi
          for n in icon-only icon-foreground icon-background splash-dark; do f=$(pick $n*.png); echo "$n: $f"; if [ -n "$f" ]; then cp "$f" assets/$n.png; fi; done
          f=$(pick $(ls splash*.png 2>/dev/null | grep -v '^splash-dark')); echo "splash: $f"; if [ -n "$f" ]; then cp "$f" assets/splash.png; fi
          k=$(pick *.keystore); echo "llave: $k"; if [ -n "$k" ]; then cp "$k" ~/.android/debug.keystore; fi
          ls -R www assets

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Generar ícono y pantalla de inicio
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor "#fdf5f8" --iconBackgroundColorDark "#1d1520" --splashBackgroundColor "#fdf5f8" --splashBackgroundColorDark "#1d1520"

      - name: Copiar la app
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../StarLux.apk

      - name: Guardar APK en Actions
        uses: actions/upload-artifact@v4
        with:
          name: StarLux-apk
          path: StarLux.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Star Lux 1.0.${{ github.run_number }}
          body: Descarga StarLux.apk desde tu celular e instálala.
          files: StarLux.apk
